<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <title>إدارة الطلاب | منصة المرسال</title>
  <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon-BiZckyoG.ico?v=2">
  <link rel="icon" type="image/png" href="/assets/favicon-NYif2_Ic.png?v=2">
  <script type="module" crossorigin src="/assets/main-BiS_1OOP.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DJeWoK0q.css">
</head>
<body>
  <nav class="navbar"></nav>
  <main class="dashboard-layout" id="teacher-students-section">
    <div class="container">
      <header class="dashboard-header">
        <div class="dashboard-userinfo">
          <h1>إدارة الطلاب</h1>
          <p class="text-muted">الطلاب المقبولون وإدارة حساباتهم.</p>
        </div>
      </header>

      <section class="card" aria-labelledby="students-heading">
        <div style="display:flex; flex-wrap:wrap; gap:1rem; align-items:end; justify-content:space-between; margin-bottom:1.25rem;">
          <h2 class="dashboard-section-title" id="students-heading" style="margin:0;">الطلاب المقبولون</h2>
          <div style="min-width:150px; padding:.75rem 1rem; background:var(--color-bg); border-radius:var(--radius-md);">
            <div class="text-muted" style="font-size:.85rem;">عدد الطلاب المقبولين</div>
            <strong id="approved-students-count" style="font-size:1.5rem; color:var(--color-primary);">—</strong>
          </div>
        </div>
        <label for="approved-students-search" class="sr-only">البحث عن طالب</label>
        <input id="approved-students-search" type="search" placeholder="ابحث بالاسم أو كود الطالب أو Gmail..." autocomplete="off"
          style="width:100%; max-width:520px; padding:.65rem .8rem; border:1px solid var(--color-primary-light); border-radius:var(--radius-md); font-family:inherit; margin-bottom:1rem;">
        <div id="approved-students-list" aria-live="polite">
          <p class="text-muted">جارٍ تحميل الطلاب...</p>
        </div>
        <div id="approved-students-pagination" style="display:flex; gap:.75rem; align-items:center; justify-content:flex-end; margin-top:1rem;"></div>
      </section>
    </div>
  </main>
  <script src="/js/profile-menu.js"></script>
</body>
</html>
