<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور | منصة المرسال</title>
  <script type="module" crossorigin src="/assets/forgot-password-BmljpRo2.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/main-1j5k-49p.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DYPYX17p.css">
  <link rel="stylesheet" crossorigin href="/assets/login-B4TTUQVE.css">
</head>
<body>
  <main class="auth-page"><div class="container"><section class="auth-form-col"><div class="card auth-card">
    <h1>نسيت كلمة المرور؟</h1>
    <p class="auth-description">أدخل Gmail وكود الطالب للتحقق من حسابك.</p>
    <form id="forgot-password-form" novalidate>
      <div class="form-group" style="margin-bottom: 1rem; text-align: right;">
        <label for="forgot-email">Gmail</label>
        <input id="forgot-email" class="form-input" type="email" autocomplete="email" placeholder="name@gmail.com" required style="width: 100%;">
      </div>
      <div class="form-group" style="margin-bottom: 1rem; text-align: right;">
        <label for="forgot-student-code">كود الطالب</label>
        <input id="forgot-student-code" class="form-input" type="text" autocomplete="off" placeholder="B12345 أو S12345" required style="width: 100%; text-transform: uppercase;">
      </div>
      <button class="btn btn-primary btn-full" type="submit">تحقق</button>
    </form>
    <a href="login.html" class="auth-back-link">العودة إلى تسجيل الدخول</a>
  </div></section></div></main>
  <div id="toast-container"></div>
</body>
</html>
