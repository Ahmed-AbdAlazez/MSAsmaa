  <script>
    // Auth bootstrap: runs before first paint so logged-in users never catch
    // even one frame of the logged-out CTA buttons. Mirrors the token check
    // the navbar uses (the stored JWT is the single source of truth).
    (function () {
      try {
        var a = !!localStorage.getItem("token");
        document.documentElement.setAttribute("data-auth", a ? "in" : "out");
      } catch (e) {
        document.documentElement.setAttribute("data-auth", "out");
      }
    })();
  </script>
