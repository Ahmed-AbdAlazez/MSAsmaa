<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <title>طلبات التسجيل | MSAsmaa</title>
  <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon-BiZckyoG.ico?v=2">
  <link rel="icon" type="image/png" href="/assets/favicon-NYif2_Ic.png?v=2">
  <script type="module" crossorigin src="/assets/main-CdETEQT7.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DPrgug63.css">
</head>
<body>
  <nav class="navbar"></nav>
  <main class="dashboard-layout" id="registration-requests-page">
    <div class="container">
      <header class="dashboard-header">
        <div class="dashboard-userinfo">
          <h1>طلبات التسجيل</h1>
          <p class="text-muted">Review and respond to pending student registration requests.</p>
        </div>
      </header>

      <section class="card" aria-labelledby="registration-requests-heading">
        <h2 class="dashboard-section-title" id="registration-requests-heading">Pending Requests</h2>
        <p class="registration-requests-summary">Pending Requests: <span class="badge badge-warning" id="pending-requests-count">0</span></p>
        <div id="registration-requests-list" aria-live="polite">
          <p class="text-muted registration-requests-loading">Loading registration requests...</p>
        </div>
      </section>
    </div>
  </main>
  <script src="/js/profile-menu.js"></script>
</body>
</html>
