<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Theme bootstrap: runs before first paint so there is no flash of the
    // wrong theme. Stored choice wins; otherwise follow the OS preference.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>إعادة تعيين كلمة المرور | منصة المرسال</title>
  <script type="module" crossorigin src="/assets/reset-password-Dg-N3D_e.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/main-CVTpXz2b.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DJeWoK0q.css">
  <link rel="stylesheet" crossorigin href="/assets/login-BnrrvKgc.css">
</head>
<body>
  <main class="auth-page"><div class="container"><section class="auth-form-col"><div class="card auth-card">
    <h1>تغيير كلمة المرور</h1>
    <p class="auth-description">أدخل كلمة المرور الجديدة ثم أكدها.</p>
    <form id="reset-password-form" novalidate>
      <div class="form-group" style="margin-bottom: 1rem; text-align: right;"><label for="new-password">كلمة المرور الجديدة</label><input id="new-password" class="form-input" type="password" autocomplete="new-password" required style="width: 100%;"></div>
      <div class="form-group" style="margin-bottom: 1rem; text-align: right;"><label for="confirm-new-password">تأكيد كلمة المرور الجديدة</label><input id="confirm-new-password" class="form-input" type="password" autocomplete="new-password" required style="width: 100%;"></div>
      <p class="password-requirements">يجب أن تحتوي على حرف كبير وحرف صغير ورقم واحد على الأقل.</p>
      <button class="btn btn-primary btn-full" type="submit">تغيير كلمة المرور</button>
    </form>
    <div id="reset-success" hidden>
      <p class="auth-description">تم تغيير كلمة المرور بنجاح.</p>
      <a href="login.html" class="btn btn-primary btn-full">العودة لتسجيل الدخول</a>
    </div>
    <a href="login.html" class="auth-back-link">العودة إلى تسجيل الدخول</a>
  </div></section></div></main>
  <div id="toast-container"></div>
</body>
</html>
